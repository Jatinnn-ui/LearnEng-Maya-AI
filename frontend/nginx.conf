server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cache static assets aggressively (they are content-hashed by the build).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------
    # OPTIONAL: same-origin API + WebSocket proxy.
    # Use this ONLY if you build the frontend WITHOUT REACT_APP_BACKEND_URL
    # (so the app calls relative "/api"). Set $backend to your API service
    # and uncomment the block. Handles the Maya voice WebSocket upgrade.
    # ---------------------------------------------------------------------
    # location /api/ {
    #     proxy_pass         http://your-backend-host:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Upgrade $http_upgrade;
    #     proxy_set_header   Connection "upgrade";
    #     proxy_set_header   Host $host;
    #     proxy_set_header   X-Real-IP $remote_addr;
    #     proxy_read_timeout 3600s;
    # }
}
